services:
  - type: web
    name: macrosniper-ai
    env: python
    region: frankfurt
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: ADMIN_API_TOKEN
        generateValue: true
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./macrosniper.db
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_VIP_CHANNEL_ID
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: DEEPGRAM_API_KEY
        sync: false
