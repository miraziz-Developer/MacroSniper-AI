version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: macrosniper_postgres
    restart: always
    environment:
      POSTGRES_DB: macrosniper_db
      POSTGRES_USER: sniper_admin
      POSTGRES_PASSWORD: sniper_secret
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sniper_admin -d macrosniper_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: macrosniper_redis
    restart: always
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  sniper_engine:
    build: .
    container_name: macrosniper_app
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - .:/app

volumes:
  postgres_data:
  redis_data:
